<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Signaler une panne — SODILAME</title>
<style>
  :root{
    --navy:#183253; --navy-d:#0F2138; --gold:#DFA64F; --terra:#C5642F;
    --cream:#FAF6EF; --ink:#1B2430; --muted:#5A6675; --line:#E4DACA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--cream);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}

  .bar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    display:flex;align-items:center;gap:12px}
  .bar a{color:#fff;text-decoration:none;display:flex;align-items:center;flex:none}
  .bar svg{width:22px;height:22px}
  .bar b{font-size:16.5px;font-weight:700}

  main{flex:1;padding:18px 16px 10px}

  .equip{background:#fff;border:1px solid var(--line);border-left:5px solid var(--terra);
    border-radius:12px;padding:13px 15px;margin-bottom:20px}
  .equip b{display:block;font-size:15px;line-height:1.3;color:var(--navy)}
  .equip span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}

  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  .champ{margin-bottom:16px}
  input,select,textarea{width:100%;padding:15px 14px;border:1px solid var(--line);
    border-radius:12px;background:#fff;font:inherit;font-size:16px;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
  textarea{min-height:110px;resize:vertical}

  /* Choix d'urgence en gros boutons, pas en menu déroulant */
  .urgence{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .urgence label{display:flex;flex-direction:column;justify-content:center;gap:3px;
    background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 13px;
    margin:0;cursor:pointer;font-weight:600;color:var(--navy);font-size:15px;min-height:74px}
  .urgence label span{font-size:12px;font-weight:400;color:var(--muted);line-height:1.35}
  .urgence input{position:absolute;opacity:0;pointer-events:none}
  .urgence input:checked + span,
  .urgence label:has(input:checked){border-color:var(--terra);background:#FBEDE5}

  .env{position:sticky;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--cream) 72%,rgba(250,246,239,0))}
  .env button{width:100%;border:0;background:var(--terra);color:#fff;font:inherit;
    font-size:17px;font-weight:700;padding:17px;border-radius:14px;cursor:pointer}
  .env p{margin:10px 0 0;text-align:center;font-size:12px;color:var(--muted)}
  .env p a{color:var(--navy);font-weight:700}
</style>
</head>
<body>

<div class="bar">
  <a href="qr-mobile.html" aria-label="Retour">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <b>Signaler une panne</b>
</div>

<main>
  <div class="equip">
    <b>Four mixte Rational iCombi Pro 10×1/1</b>
    <span>Réf. SOD-4412 — identifié automatiquement par le QR code</span>
  </div>

  <div class="champ">
    <label>Que se passe-t-il ?</label>
    <textarea placeholder="La machine ne chauffe plus, code erreur E12 affiché depuis ce matin…"></textarea>
  </div>

  <div class="champ">
    <label>Est-ce bloquant ?</label>
    <div class="urgence">
      <label><input type="radio" name="u" checked>Bloquant<span>Le service est impacté</span></label>
      <label><input type="radio" name="u">Non bloquant<span>On peut planifier</span></label>
    </div>
  </div>

  <div class="champ">
    <label>Votre établissement</label>
    <input type="text" placeholder="Restaurant Le Mas">
  </div>

  <div class="champ">
    <label>Votre téléphone</label>
    <input type="tel" inputmode="tel" placeholder="06 12 34 56 78">
  </div>

  <div class="champ">
    <label>Votre nom</label>
    <input type="text" placeholder="Marie Dupont">
  </div>
</main>

<div class="env">
  <button type="button">Envoyer le signalement</button>
  <p>Réponse sous 24 h ouvrées. Urgence&nbsp;: <a href="tel:+33490939888">04 90 93 98 88</a></p>
</div>

</body>
</html>
